name: Atualiza painel de contribuições

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  # A agenda atualiza a branch padrão; a V3 mantém validação por push.
  # O SVG não está neste filtro, evitando ciclos de atualização.
  push:
    branches: [main, feat/profile-readme-v3]
    paths:
      - scripts/generate-contributions.mjs
      - scripts/test-contributions.mjs
      - .github/workflows/update-contributions.yml

permissions:
  contents: write

concurrency:
  group: painel-contribuicoes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.repository == 'pedro-art2611/pedro-art2611' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/profile-readme-v3')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtém a branch da execução
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gera SVG com o calendário da própria conta
        # Token clássico dedicado com read:user. Não usar GITHUB_TOKEN para a consulta.
        # Ativar Private contributions no perfil; autorizar SAML SSO se exigido pela organização.
        env:
          PROFILE_CONTRIBUTIONS_TOKEN: ${{ secrets.PROFILE_CONTRIBUTIONS_TOKEN }}
        run: node scripts/generate-contributions.mjs --audit "$RUNNER_TEMP/calendario-real.json"
      - name: Confere todos os dias e níveis antes de publicar
        run: node scripts/test-contributions.mjs "$RUNNER_TEMP/calendario-real.json"
      - name: Registra somente alterações do SVG
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            main|feat/profile-readme-v3) ;;
            *) echo 'Branch não autorizada para publicação.'; exit 1 ;;
          esac
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          git add -- assets/v3/contributions/contributions.svg
          if git diff --cached --quiet; then
            echo 'O calendário não mudou.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(contribuicoes): atualiza calendário do perfil'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
