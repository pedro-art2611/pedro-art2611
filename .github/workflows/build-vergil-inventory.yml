name: Build Vergil Asset Inventory

on:
  push:
    branches:
      - feat/profile-readme-v2
    paths:
      - "vergil-assets.zip"
      - "scripts/inspect_vergil_assets.py"
      - ".github/workflows/build-vergil-inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/profile-readme-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Inspect and extract assets
        run: python scripts/inspect_vergil_assets.py

      - name: Commit generated inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v2/vergil/INVENTORY.md assets/v2/vergil/source_raw
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: extrai e inventaria assets do Vergil"
          git push origin HEAD:feat/profile-readme-v2
